<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tools</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        nav a { margin-right: 12px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
<nav>
    <a href="/characters">Characters</a>
    <a href="/characters/tools">Tools</a>
    <a href="/characters/battle">Battle</a>
</nav>

<h2>Tools</h2>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>Power Boost</th>
        <th>Life Boost</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${tools}">
        <td th:text="${t.name}"></td>
        <td th:text="${t.powerBoost}"></td>
        <td th:text="${t.lifeBoost}"></td>
        <td>
            <form th:action="@{/characters/tools/buy}" method="post">
                <input type="hidden" th:name="toolId" th:value="${t.id}"/>
                <input type="hidden" th:name="characterId" th:value="${characters[0].id}"/>
                <button type="submit">Buy</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
