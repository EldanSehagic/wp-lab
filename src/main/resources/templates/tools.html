<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Tools</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        nav a { margin-right: 12px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
<nav>
    <a href="/">Characters</a>
    <a href="/tools">Tools</a>
    <a href="/battle">Battle</a>
</nav>

<h2>Tools</h2>

<form method="post" th:action="@{/tools/buy}">
    <label>Choose Character:
        <select name="characterId" required>
            <option th:each="c : ${characters}" th:value="${c.id}" th:text="${c.name}"></option>
        </select>
    </label>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Power Boost</th>
            <th>Life Boost</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tools}">
            <td th:text="${t.name}"></td>
            <td th:text="${t.powerBoost}"></td>
            <td th:text="${t.lifeBoost}"></td>
            <td>
                <button type="submit" th:name="toolId" th:value="${t.id}">Buy</button>
            </td>
        </tr>
        </tbody>
    </table>
</form>

</body>
</html>
