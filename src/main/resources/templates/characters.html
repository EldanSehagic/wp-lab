<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Characters</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f2f2f2; }
        .badge { background:#eee; padding:2px 6px; margin-right:6px; border-radius:4px; display:inline-block;}
        nav a { margin-right: 12px; }
    </style>
</head>
<body>
<nav>
    <a href="/characters">Characters</a>
    <a href="/characters/tools">Tools</a>
    <a href="/characters/battle">Battle</a>
</nav>

<h2>Characters</h2>

<a href="/characters/new">Add New Character</a>

<table>
    <thead>
    <tr>
        <th>ID</th><th>Name</th><th>Power</th><th>Lives</th><th>Points</th><th>Total Power</th><th>Total Lives</th><th>Level</th><th>Tools</th><th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${characters}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.power}"></td>
        <td th:text="${c.lives}"></td>
        <td th:text="${c.points}"></td>
        <td th:text="${c.totalPower()}"></td>
        <td th:text="${c.totalLives()}"></td>
        <td th:text="${c.level}"></td>
        <td>
            <span th:each="t : ${c.tools}" th:text="${t.name}" class="badge"></span>
        </td>
        <td>
            <a th:href="@{/characters/edit/{id}(id=${c.id})}">Edit</a> |
            <a th:href="@{/characters/delete/{id}(id=${c.id})}" onclick="return confirm('Delete this character?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
